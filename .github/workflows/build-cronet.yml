name: Build Latest Chromium Cronet Linux x64

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

env:
  DEPOT_TOOLS: /home/runner/depot_tools
  CHROMIUM_ROOT: /home/runner/chromium
  CHROMIUM_SRC: /home/runner/chromium/src
  OUT_DIR: /home/runner/chromium/src/out/Cronet
  GIT_TERMINAL_PROMPT: '0'
  DEPOT_TOOLS_UPDATE: '1'

jobs:
  linux-x64:
    name: Linux x64 Cronet
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Show runner information
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          arch
          nproc
          free -h
          df -h /

      - name: Install required host packages
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            git-lfs \
            lsb-release \
            ninja-build \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip

      - name: Install latest depot_tools and bootstrap it
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$DEPOT_TOOLS"
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$DEPOT_TOOLS"

          cd "$DEPOT_TOOLS"

          # IMPORTANT:
          # A fresh depot_tools checkout is not bootstrapped yet. The current
          # depot_tools wrappers require python3_bin_reldir.txt, which is
          # created by ensure_bootstrap/update_depot_tools.
          ./ensure_bootstrap

          test -f "$DEPOT_TOOLS/python3_bin_reldir.txt"

          export PATH="$DEPOT_TOOLS:$PATH"
          command -v gclient
          command -v fetch
          command -v gn
          command -v autoninja
          python3 --version
          gclient --version || true

      - name: Checkout latest Chromium main without Git history
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"

          rm -rf "$CHROMIUM_ROOT"
          mkdir -p "$CHROMIUM_ROOT"
          cd "$CHROMIUM_ROOT"

          # Always use the current Chromium main branch. No historical Git data.
          fetch --nohooks --no-history chromium

          cd "$CHROMIUM_SRC"

          echo '=== Chromium revision ==='
          git rev-parse HEAD | tee /home/runner/chromium_revision.txt

          echo '=== Chromium version ==='
          cat chrome/VERSION | tee /home/runner/chromium_version.txt

          echo '=== Disk usage after checkout ==='
          df -h /

      - name: Install Chromium build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CHROMIUM_SRC"

          # Use Chromium's own dependency installer so the package list tracks
          # the current Chromium source instead of a stale hand-maintained list.
          sudo ./build/install-build-deps.sh \
            --no-prompt \
            --no-chromeos-fonts \
            --no-nacl

      - name: Run Chromium hooks
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"

          # Hooks download the current build tools and other DEPS-managed data.
          gclient runhooks

          echo '=== Disk usage after hooks ==='
          df -h /

      - name: Configure Cronet Linux x64
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CHROMIUM_SRC"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          # Write args.gn directly. Avoid shell/YAML heredoc escaping issues.
          printf '%s\n' \
            '# Latest Chromium desktop Cronet, Linux x86-64.' \
            'target_cpu = "x64"' \
            'current_cpu = "x64"' \
            'is_debug = false' \
            'is_component_build = false' \
            '' \
            '# Disable PGO because the free runner does not prefetch Chrome PGO profiles.' \
            'chrome_pgo_phase = 0' \
            '' \
            'symbol_level = 0' \
            'blink_symbol_level = 0' \
            'v8_symbol_level = 0' \
            'dcheck_always_on = false' \
            'use_goma = false' \
            'use_remoteexec = false' \
            'enable_nacl = false' \
            > "$OUT_DIR/args.gn"

          echo '=== args.gn ==='
          cat "$OUT_DIR/args.gn"

          GN="$CHROMIUM_SRC/buildtools/linux64/gn"
          test -x "$GN"
          "$GN" gen "$OUT_DIR"

          echo '=== GN args ==='
          "$GN" args "$OUT_DIR" --list > /home/runner/gn_args.txt

      - name: Build Cronet shared library
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"

          # Only build the native Linux Cronet shared-library target.
          autoninja -C "$OUT_DIR" //components/cronet:cronet

      - name: Collect and verify libcronet.so
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CHROMIUM_SRC"

          mkdir -p /home/runner/cronet-artifact

          found=''
          while IFS= read -r f; do
            found="$f"
            break
          done < <(
            find "$OUT_DIR" -type f \
              \( -name 'libcronet*.so' -o -name 'cronet*.so' \) \
              -print | sort
          )

          if [[ -z "$found" ]]; then
            echo 'ERROR: Cronet shared library was not produced.'
            echo '=== Existing shared libraries ==='
            find "$OUT_DIR" -type f -name '*.so*' -print | sort | head -200 || true
            exit 1
          fi

          echo "Found: $found"
          cp -L "$found" /home/runner/cronet-artifact/libcronet.so

          echo '=== file ==='
          file /home/runner/cronet-artifact/libcronet.so

          echo '=== ELF header ==='
          readelf -h /home/runner/cronet-artifact/libcronet.so

          echo '=== Architecture check ==='
          machine="$(readelf -h /home/runner/cronet-artifact/libcronet.so | awk -F: '/Machine:/ {gsub(/^ +| +$/, "", $2); print $2}')"
          if [[ "$machine" != 'Advanced Micro Devices X86-64' ]]; then
            echo "ERROR: Expected x86-64, got: $machine"
            exit 1
          fi

          echo '=== SHA256 ==='
          sha256sum /home/runner/cronet-artifact/libcronet.so | tee /home/runner/cronet-artifact/SHA256SUMS.txt

          printf '%s\n' \
            "Chromium revision: $(git rev-parse HEAD)" \
            "Chromium version: $(tr '\n' ' ' < chrome/VERSION)" \
            'Runner: ubuntu-latest' \
            'Architecture: x86_64' \
            'GN target: //components/cronet:cronet' \
            "Original shared library: $found" \
            'Packaged shared library: libcronet.so' \
            'PGO: disabled (chrome_pgo_phase = 0)' \
            > /home/runner/cronet-artifact/build-info.txt\n\n          cat /home/runner/cronet-artifact/build-info.txt

      - name: Upload Cronet artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-latest
          path: /home/runner/cronet-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-build-metadata
          path: |
            /home/runner/chromium_revision.txt
            /home/runner/chromium_version.txt
            /home/runner/gn_args.txt
          if-no-files-found: warn
          retention-days: 7
