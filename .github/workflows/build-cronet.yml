name: Build Cronet (Win & Linux)

on:
  workflow_dispatch: # 支持手动触发
  push:
    branches: [ main ]

jobs:
  # ==========================================
  # Linux: 编译 libcronet.so
  # ==========================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git curl build-essential libglib2.0-dev libnss3-dev libdbus-1-dev

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch Chromium Source (Shallow & Latest only)
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          mkdir -p chromium && cd chromium
          
          # 创建不包含历史版本的 gclient 配置
          cat << 'EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          EOF

          # --no-history 和 --shallow-submodules 极大减少下载量与历史记录
          gclient sync --no-history --shallow --nohooks -j 8

          cd src
          # 安装系统依赖并执行环境 hooks
          build/install-build-deps.sh --no-prompt --no-chromeos-fonts
          gclient runhooks

      - name: GN Gen & Build Cronet (.so)
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd chromium/src
          
          mkdir -p out/Release
          # 仅编译必要的 cronet 产物，关闭测试与非必要模块以节省时间和空间
          cat << 'EOF' > out/Release/args.gn
          is_component_build = false
          is_debug = false
          symbol_level = 0
          use_custom_libcxx = true
          treat_warnings_as_errors = false
          EOF

          gn gen out/Release
          # 仅编译 cronet
          ninja -C out/Release cronet

      - name: Upload Linux Cronet (.so)
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux
          path: chromium/src/out/Release/libcronet.*.so


  # ==========================================
  # Windows: 编译 cronet.dll
  # ==========================================
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Configure Git
        shell: bash
        run: |
          git config --system core.longpaths true

      - name: Install depot_tools
        shell: bash
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /c/depot_tools
          # depot_tools 必须在 PATH 最前端
          echo "C:/depot_tools" >> $GITHUB_PATH
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> $GITHUB_ENV

      - name: Fetch Chromium Source (Shallow & Latest only)
        shell: bash
        run: |
          export PATH="/c/depot_tools:$PATH"
          mkdir -p /c/chromium && cd /c/chromium

          cat << 'EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          EOF

          # 仅拉取最新 commit，不拉取历史
          gclient sync --no-history --shallow --nohooks -j 8
          cd src
          gclient runhooks

      - name: GN Gen & Build Cronet (.dll)
        shell: bash
        run: |
          export PATH="/c/depot_tools:$PATH"
          cd /c/chromium/src

          mkdir -p out/Release
          cat << 'EOF' > out/Release/args.gn
          is_component_build = false
          is_debug = false
          symbol_level = 0
          treat_warnings_as_errors = false
          EOF

          gn gen out/Release
          # 仅编译 cronet
          ninja -C out/Release cronet

      - name: Upload Windows Cronet (.dll)
        uses: actions/upload-artifact@v4
        with:
          name: cronet-windows
          path: |
            C:/chromium/src/out/Release/cronet.dll
            C:/chromium/src/out/Release/cronet.dll.lib
