name: Build Cronet (Win & Linux)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  # ==========================================
  # Linux: 编译 libcronet.so
  # ==========================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git curl build-essential pkg-config libglib2.0-dev libnss3-dev libdbus-1-dev

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch Chromium Source (Shallow & Latest only)
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          mkdir -p chromium && cd chromium
          
          # 禁止下载不相关的 Android / iOS 大包，节省 20GB+ 空间
          cat << 'EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": False,
                "checkout_android_prebuilts": False,
                "checkout_android_native_support": False,
                "checkout_ios": False,
                "checkout_mac": False,
                "checkout_win": False,
                "checkout_linux": True,
              },
            },
          ]
          EOF

          # 仅浅拉取最新代码，不下载历史提交
          gclient sync --no-history --shallow --nohooks -j 8

          cd src
          build/install-build-deps.sh --no-prompt --no-chromeos-fonts --no-android
          gclient runhooks

      - name: GN Gen & Build Cronet (.so)
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd chromium/src
          
          mkdir -p out/Release
          # 核心：通过 root_extra_deps 将 cronet 加入 Ninja 根构建树
          cat << 'EOF' > out/Release/args.gn
          is_component_build = false
          is_debug = false
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          use_custom_libcxx = true
          treat_warnings_as_errors = false
          root_extra_deps = [ "//components/cronet:cronet" ]
          EOF

          gn gen out/Release
          
          # 使用明确的组件目标进行编译
          ninja -C out/Release components/cronet:cronet

          # 列出产物以供确认
          ls -lh out/Release/libcronet* || ls -lh out/Release/*cronet*

      - name: Upload Linux Cronet (.so)
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux
          path: |
            chromium/src/out/Release/libcronet*.so
            chromium/src/out/Release/*cronet*.so


  # ==========================================
  # Windows: 编译 cronet.dll
  # ==========================================
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Configure Git Longpaths
        shell: bash
        run: |
          git config --system core.longpaths true

      - name: Install depot_tools
        shell: bash
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /c/depot_tools
          echo "C:/depot_tools" >> $GITHUB_PATH
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> $GITHUB_ENV

      - name: Fetch Chromium Source (Shallow & Latest only)
        shell: bash
        run: |
          export PATH="/c/depot_tools:$PATH"
          mkdir -p /c/chromium && cd /c/chromium

          cat << 'EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": False,
                "checkout_android_prebuilts": False,
                "checkout_android_native_support": False,
                "checkout_ios": False,
                "checkout_mac": False,
                "checkout_win": True,
                "checkout_linux": False,
              },
            },
          ]
          EOF

          # 浅拉取
          gclient sync --no-history --shallow --nohooks -j 8
          cd src
          gclient runhooks

      - name: GN Gen & Build Cronet (.dll)
        shell: bash
        run: |
          export PATH="/c/depot_tools:$PATH"
          cd /c/chromium/src

          mkdir -p out/Release
          # 核心：通过 root_extra_deps 将 cronet 加入 Ninja 根构建树
          cat << 'EOF' > out/Release/args.gn
          is_component_build = false
          is_debug = false
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          treat_warnings_as_errors = false
          root_extra_deps = [ "//components/cronet:cronet" ]
          EOF

          gn gen out/Release
          
          # 使用明确的组件目标进行编译
          ninja -C out/Release components/cronet:cronet

          # 查看产物
          ls -lh out/Release/cronet*

      - name: Upload Windows Cronet (.dll & .lib)
        uses: actions/upload-artifact@v4
        with:
          name: cronet-windows
          path: |
            C:/chromium/src/out/Release/cronet*.dll
            C:/chromium/src/out/Release/cronet*.lib
