name: Build Chromium net desktop components

on:
  workflow_dispatch:
    inputs:
      chromium_version:
        description: 'Chromium tag to build (pin this value)'
        required: true
        default: '153.0.8010.36'
        type: string

# This builds Chromium's desktop //net component. Chromium's official Cronet
# target is Android-only; //net is the closest upstream desktop target and is
# an internal component, not a standalone Cronet-compatible C API.

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            target_os: linux
            artifact: chromium-net-linux-x64
          - platform: windows-x64
            runner: windows-2022
            target_os: win
            artifact: chromium-net-windows-x64

    env:
      CHROMIUM_VERSION: ${{ inputs.chromium_version }}
      DEPOT_TOOLS_UPDATE: '0'
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux host dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates git ninja-build pkg-config python3

      - name: Configure Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global depot-tools.allowGlobalGitConfig false

      - name: Install depot_tools
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Cache Chromium toolchains
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/chromium/src/third_party/llvm-build/Release+Asserts
            ${{ runner.temp }}/chromium/src/third_party/gn
            ${{ runner.temp }}/chromium/src/gn
          key: chromium-${{ matrix.platform }}-${{ inputs.chromium_version }}-v1

      - name: Check out Chromium and synchronize dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/chromium"
          cd "$RUNNER_TEMP/chromium"
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "checkout_nacl": False,
                "checkout_pgo_profiles": False,
              },
            },
          ]
          EOF
          git clone --depth=1 --branch "$CHROMIUM_VERSION" \
            https://chromium.googlesource.com/chromium/src.git src
          gclient sync --no-history --shallow --nohooks
          gclient runhooks

      - name: Install Linux sysroot
        if: runner.os == 'Linux'
        shell: bash
        working-directory: ${{ runner.temp }}/chromium/src
        run: python3 build/linux/sysroot_scripts/install-sysroot.py --arch=amd64

      - name: Generate GN files
        shell: bash
        working-directory: ${{ runner.temp }}/chromium/src
        env:
          TARGET_OS: ${{ matrix.target_os }}
        run: |
          set -euxo pipefail
          COMMON='is_debug=false is_component_build=true is_official_build=false symbol_level=0 use_thin_lto=false treat_warnings_as_errors=false fatal_linker_warnings=false chrome_pgo_phase=0 enable_nacl=false'
          if [ "$TARGET_OS" = linux ]; then
            GN_ARGS="$COMMON target_os=\"linux\" target_cpu=\"x64\" use_sysroot=true"
          else
            GN_ARGS="$COMMON target_os=\"win\" target_cpu=\"x64\""
          fi
          gn gen out/Release --args="$GN_ARGS"

      - name: Build Chromium net component
        shell: bash
        working-directory: ${{ runner.temp }}/chromium/src
        env:
          TARGET_OS: ${{ matrix.target_os }}
        run: |
          set -euxo pipefail
          autoninja -C out/Release net
          if [ "$TARGET_OS" = linux ]; then
            test -f out/Release/libnet.so
            cp out/Release/libnet.so "$GITHUB_WORKSPACE/"
          else
            test -f out/Release/net.dll
            cp out/Release/net.dll "$GITHUB_WORKSPACE/"
            test ! -f out/Release/net.lib || cp out/Release/net.lib "$GITHUB_WORKSPACE/"
          fi

      - name: Upload desktop net component
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ inputs.chromium_version }}
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/libnet.so
            ${{ github.workspace }}/net.dll
            ${{ github.workspace }}/net.lib
