name: Build Latest Chromium Cronet Linux x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEPOT_TOOLS: ${{ github.workspace }}/depot_tools
      CHROMIUM_SRC: ${{ github.workspace }}/chromium/src
      OUT_DIR: ${{ github.workspace }}/chromium/src/out/Release
      DEPOT_TOOLS_UPDATE: "0"
      CHROMIUM_GIT_CREDENTIAL_HELPER: "none"

    steps:
      - name: Show runner information
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          lsb_release -a || true
          echo "CPU:" && nproc
          echo "Memory:" && free -h
          echo "Disk:" && df -hT
          test "$(uname -m)" = "x86_64"

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          echo "Before cleanup:"
          df -hT
          sudo rm -rf /usr/local/lib/android /usr/local/share/powershell /usr/share/dotnet /opt/ghc /opt/hostedtoolcache || true
          sudo docker system prune -af || true
          sudo apt-get clean || true
          echo "After cleanup:"
          df -hT

      - name: Install base dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            curl \
            git \
            python3 \
            python3-pip \
            python3-venv \
            lsb-release \
            sudo \
            file \
            unzip \
            zip \
            bzip2 \
            xz-utils \
            rsync \
            ninja-build \
            ccache \
            pkg-config \
            patchelf \
            elfutils

      - name: Install depot_tools
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "${DEPOT_TOOLS}"
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${DEPOT_TOOLS}"
          echo "${DEPOT_TOOLS}" >> "${GITHUB_PATH}"
          echo "${DEPOT_TOOLS}/python-bin" >> "${GITHUB_PATH}"
          git -C "${DEPOT_TOOLS}" rev-parse HEAD | tee "${GITHUB_WORKSPACE}/depot_tools_revision.txt"

      - name: Checkout latest Chromium main without history
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail
          rm -rf "${GITHUB_WORKSPACE}/chromium"
          fetch --nohooks --no-history chromium
          cd "${CHROMIUM_SRC}"
          git rev-parse HEAD | tee "${GITHUB_WORKSPACE}/chromium_revision.txt"
          git log -1 --format='%H%n%ad%n%s' --date=iso-strict | tee "${GITHUB_WORKSPACE}/chromium_commit.txt"
          git describe --always --tags > "${GITHUB_WORKSPACE}/chromium_describe.txt" || true

      - name: Install Chromium official build dependencies
        shell: bash
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: |
          set -euxo pipefail
          sudo build/install-build-deps.sh --no-prompt

      - name: Run Chromium hooks
        shell: bash
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: |
          set -euxo pipefail
          gclient runhooks

      - name: Configure Linux kernel
        shell: bash
        run: |
          set -euxo pipefail
          sudo sysctl -w vm.max_map_count=262144
          sysctl vm.max_map_count

      - name: Generate Cronet desktop Linux x64 GN files
        shell: bash
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: |
          set -euxo pipefail
          rm -rf "${OUT_DIR}"
          gn gen "${OUT_DIR}" --args='is_debug=false is_component_build=false target_os="linux" target_cpu="x64" symbol_level=0 blink_symbol_level=0 enable_nacl=false use_goma=false use_remoteexec=false treat_warnings_as_errors=false dcheck_always_on=false'
          gn args "${OUT_DIR}" --list > "${GITHUB_WORKSPACE}/gn_args_list.txt"
          gn desc "${OUT_DIR}" //components/cronet:cronet --tree > "${GITHUB_WORKSPACE}/cronet_target_tree.txt"

      - name: Build Cronet shared library
        shell: bash
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: |
          set -euxo pipefail
          autoninja -C "${OUT_DIR}" //components/cronet:cronet

      - name: Validate and collect libcronet.so
        shell: bash
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: |
          set -euxo pipefail
          CRONET_SO="$(find "${OUT_DIR}" -type f -name 'libcronet.so' -print -quit || true)"
          if [ -z "${CRONET_SO}" ]; then
            echo "ERROR: libcronet.so was not produced."
            find "${OUT_DIR}" -type f -iname '*cronet*.so*' -print || true
            exit 1
          fi
          file "${CRONET_SO}"
          readelf -h "${CRONET_SO}"
          file -b "${CRONET_SO}" | grep -q 'ELF 64-bit'
          file -b "${CRONET_SO}" | grep -q 'x86-64'
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cp -L "${CRONET_SO}" "${GITHUB_WORKSPACE}/artifacts/libcronet.so"
          {
            echo "Chromium revision: $(cat "${GITHUB_WORKSPACE}/chromium_revision.txt")"
            echo "depot_tools revision: $(cat "${GITHUB_WORKSPACE}/depot_tools_revision.txt")"
            echo "Runner OS: $(lsb_release -ds 2>/dev/null || true)"
            echo "Runner arch: $(uname -m)"
            echo "Target: //components/cronet:cronet"
          } > "${GITHUB_WORKSPACE}/artifacts/build_info.txt"
          sha256sum "${GITHUB_WORKSPACE}/artifacts/libcronet.so" | tee "${GITHUB_WORKSPACE}/artifacts/libcronet.so.sha256"
          ls -lah "${GITHUB_WORKSPACE}/artifacts"

      - name: Upload Cronet artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-latest
          path: |
            artifacts/libcronet.so
            artifacts/libcronet.so.sha256
            artifacts/build_info.txt
            chromium_revision.txt
            chromium_commit.txt
            chromium_describe.txt
            depot_tools_revision.txt
            gn_args_list.txt
            cronet_target_tree.txt
          if-no-files-found: error
          compression-level: 0

      - name: Final disk report
        if: always()
        shell: bash
        run: |
          set +e
          df -hT
