name: Build Latest Chromium Cronet Linux x64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-latest-cronet-linux-x64
  cancel-in-progress: true

env:
  DEPOT_TOOLS: /home/runner/depot_tools
  CHROMIUM_ROOT: /home/runner/chromium
  CHROMIUM_SRC: /home/runner/chromium/src
  OUT_DIR: /home/runner/chromium/src/out/Cronet

jobs:
  linux-x64:
    name: Build Chromium Cronet Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Show runner information
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          arch
          nproc
          free -h
          df -h /
          python3 --version
          git --version

      - name: Install basic host packages
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            git-lfs \
            lsb-release \
            ninja-build \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip

      - name: Install latest depot_tools and bootstrap
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$DEPOT_TOOLS"
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$DEPOT_TOOLS"

          export PATH="$DEPOT_TOOLS:$PATH"

          cd "$DEPOT_TOOLS"
          ./ensure_bootstrap

          test -f "$DEPOT_TOOLS/python3_bin_reldir.txt"

          command -v gclient
          command -v fetch
          command -v autoninja

          gclient --version || true

      - name: Install Chromium build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/chromium-deps
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/src.git \
            /tmp/chromium-deps

          cd /tmp/chromium-deps

          sudo ./build/install-build-deps.sh \
            --no-prompt \
            --no-chromeos-fonts \
            --no-nacl

          rm -rf /tmp/chromium-deps

      - name: Checkout latest Chromium main without Git history
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"

          rm -rf "$CHROMIUM_ROOT"
          mkdir -p "$CHROMIUM_ROOT"
          cd "$CHROMIUM_ROOT"

          fetch --nohooks --no-history chromium

          cd "$CHROMIUM_SRC"
          echo "Chromium revision:"
          git rev-parse HEAD | tee /home/runner/chromium_revision.txt

          echo "Chromium version:"
          cat chrome/VERSION | tee /home/runner/chromium_version.txt

      - name: Sync dependencies and run hooks
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"

          gclient sync -D --force --reset --no-history
          gclient runhooks

          test -x "$CHROMIUM_SRC/buildtools/linux64/gn"
          test -x "$DEPOT_TOOLS/autoninja"

      - name: Patch Cronet BUILD.gn for Linux
        shell: bash
        run: |
          set -euxo pipefail
          python3 - "$CHROMIUM_SRC/components/cronet/BUILD.gn" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          marker = "# BEGIN linux cronet target"

          if marker not in text:
              def replace_once(old, new, description):
                  global text
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"Expected one {description}, found {count}"
                      )
                  text = text.replace(old, new, 1)

              replace_once(
                  'import("//build/config/android/rules.gni")\n',
                  'if (is_android) {\n'
                  '  import("//build/config/android/rules.gni")\n'
                  '}\n',
                  "Android rules import",
              )
              replace_once(
                  'proto_java_library("request_context_config_java_proto") {\n'
                  '  proto_path = "."\n'
                  '  sources = [ "proto/request_context_config.proto" ]\n'
                  '}\n',
                  'if (is_android) {\n'
                  '  proto_java_library("request_context_config_java_proto") {\n'
                  '    proto_path = "."\n'
                  '    sources = [ "proto/request_context_config.proto" ]\n'
                  '  }\n'
                  '}\n',
                  "Android proto target",
              )
              replace_once(
                  '  public_deps = [ "//components/metrics:library_support" ]\n',
                  '  if (!is_android) {\n'
                  '    deps -= [ "//components/cronet/android:cronet_jni_headers" ]\n'
                  '  }\n\n'
                  '  public_deps = [ "//components/metrics:library_support" ]\n',
                  "Cronet Android JNI dependency",
              )
              replace_once(
                  'group("cronet_package") {\n'
                  '  testonly = true\n'
                  '  deps = [ "//components/cronet/android:cronet_package_android" ]\n'
                  '}\n',
                  'if (is_android) {\n'
                  '  group("cronet_package") {\n'
                  '    testonly = true\n'
                  '    deps = [ "//components/cronet/android:cronet_package_android" ]\n'
                  '  }\n'
                  '}\n',
                  "Android Cronet package group",
              )

              text = text.rstrip() + '''

          # BEGIN linux cronet target
          if (is_linux) {
            static_library("cronet_static") {
              deps = [
                ":cronet_common",
                "//base",
                "//net",
              ]
              sources = [ "cronet_global_state_stubs.cc" ]
              complete_static_lib = true
              configs -= [ "//build/config/compiler:thin_archive" ]
            }

            shared_library("cronet") {
              deps = [ ":cronet_static" ]
            }
          }
          # END linux cronet target
          '''
              path.write_text(text)

          if marker not in path.read_text():
              raise SystemExit("Cronet BUILD.gn patch was not applied")
          print(f"Patched {path}")
          PY

      - name: Configure Linux x64 Cronet with GN
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CHROMIUM_SRC"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          printf '%s\n' \
            'target_cpu = "x64"' \
            'current_cpu = "x64"' \
            '' \
            'is_debug = false' \
            'is_component_build = false' \
            'is_official_build = false' \
            'is_cronet_build = false' \
            'root_extra_deps = [ "//components/cronet:cronet" ]' \
            'use_platform_icu_alternatives = false' \
            '' \
            '# Disable Chrome'"'"'s PGO profile lookup because --no-history does not' \
            '# checkout the optional profile files.' \
            'chrome_pgo_phase = 0' \
            '' \
            'symbol_level = 0' \
            'blink_symbol_level = 0' \
            'v8_symbol_level = 0' \
            '' \
            'dcheck_always_on = false' \
            > "$OUT_DIR/args.gn"

          GN="$CHROMIUM_SRC/buildtools/linux64/gn"
          test -x "$GN"

          echo '=== args.gn ==='
          cat "$OUT_DIR/args.gn"

          "$GN" gen "$OUT_DIR"
      - name: Build only Cronet shared library
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"

          # Match the local successful build command.
          autoninja -C "$OUT_DIR" cronet

      - name: Locate and validate Cronet Linux x64 library
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CHROMIUM_SRC"

          mkdir -p /home/runner/cronet-artifact

          found="$(find "$OUT_DIR" -type f \( -name 'libcronet.so' -o -name 'libcronet.*.so' -o -name 'cronet.*.so' \) -print | head -n 1 || true)"

          if [[ -z "$found" ]]; then
            echo 'ERROR: No Cronet shared library was produced.'
            echo 'All shared libraries under the output directory:'
            find "$OUT_DIR" -type f -name '*.so' -print | head -200 || true
            exit 1
          fi

          echo "Found: $found"
          cp -L "$found" /home/runner/cronet-artifact/libcronet.so

          file /home/runner/cronet-artifact/libcronet.so
          readelf -h /home/runner/cronet-artifact/libcronet.so

          file /home/runner/cronet-artifact/libcronet.so | grep -Eq 'ELF 64-bit.*x86-64'

          sha256sum /home/runner/cronet-artifact/libcronet.so \
            | tee /home/runner/cronet-artifact/SHA256SUMS.txt

          {
            echo "Chromium revision: $(git -C "$CHROMIUM_SRC" rev-parse HEAD)"
            echo "Chromium version: $(tr '\n' ' ' < "$CHROMIUM_SRC/chrome/VERSION")"
            echo "Runner: ubuntu-latest"
            echo "Architecture: x86_64"
            echo "GN target: //components/cronet:cronet"
            echo "Source library: $found"
          } > /home/runner/cronet-artifact/build-info.txt

      - name: Upload Cronet artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-latest
          path: /home/runner/cronet-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-build-metadata
          path: |
            /home/runner/chromium_revision.txt
            /home/runner/chromium_version.txt
            /home/runner/cronet_target_desc.txt
          if-no-files-found: warn
          retention-days: 7
