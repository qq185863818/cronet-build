name: Build Latest Chromium Cronet Linux x64

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

env:
  DEPOT_TOOLS: /home/runner/depot_tools
  CHROMIUM_ROOT: /home/runner/chromium
  CHROMIUM_SRC: /home/runner/chromium/src
  OUT_DIR: /home/runner/chromium/src/out/Cronet
  GIT_TERMINAL_PROMPT: '0'
  DEPOT_TOOLS_UPDATE: '1'

jobs:
  linux-x64:
    name: Linux x64 Cronet
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Show runner information
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          uname -a
          lsb_release -a || true
          arch
          nproc
          free -h
          df -h /

      - name: Install base packages
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            git-lfs \
            lsb-release \
            ninja-build \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip

      - name: Install Chromium build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

          rm -rf /tmp/chromium-deps
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/src.git \
            /tmp/chromium-deps

          cd /tmp/chromium-deps
          sudo ./build/install-build-deps.sh \
            --no-prompt \
            --no-chromeos-fonts \
            --no-nacl

          rm -rf /tmp/chromium-deps

      - name: Install and bootstrap latest depot_tools
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

          rm -rf "$DEPOT_TOOLS"
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$DEPOT_TOOLS"

          cd "$DEPOT_TOOLS"
          ./ensure_bootstrap

          test -f "$DEPOT_TOOLS/python3_bin_reldir.txt"

          export PATH="$DEPOT_TOOLS:$PATH"
          command -v gclient
          command -v fetch
          command -v autoninja
          gclient --version

      - name: Checkout latest Chromium main without history
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

          rm -rf "$CHROMIUM_ROOT"
          mkdir -p "$CHROMIUM_ROOT"
          cd "$CHROMIUM_ROOT"

          fetch --nohooks --no-history chromium

          cd "$CHROMIUM_SRC"
          git rev-parse HEAD | tee /home/runner/chromium_revision.txt
          cat chrome/VERSION | tee /home/runner/chromium_version.txt
          df -h /

      - name: Sync dependencies and run Chromium hooks
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          cd "$CHROMIUM_SRC"

          gclient sync -D --force --reset --no-history
          gclient runhooks

          test -x "$CHROMIUM_SRC/buildtools/linux64/gn"
          test -x "$DEPOT_TOOLS/autoninja"

          "$CHROMIUM_SRC/buildtools/linux64/gn" --version
          df -h /

      - name: Configure Cronet Linux x64
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          cd "$CHROMIUM_SRC"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          # PGO profiles are not checked out by the default Chromium checkout.
          # Disable PGO so GN does not require chrome/build/pgo_profiles/*.profdata.
          cat > "$OUT_DIR/args.gn" <<'EOF_GN'
          target_cpu = "x64"
          current_cpu = "x64"
          is_debug = false
          is_component_build = false
          is_official_build = false
          chrome_pgo_phase = 0
          dcheck_always_on = false
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          use_goma = false
          use_remoteexec = false
          enable_nacl = false
          EOF_GN

          # Remove indentation introduced by the YAML heredoc.
          sed -i 's/^          //' "$OUT_DIR/args.gn"

          cat "$OUT_DIR/args.gn"
          "$CHROMIUM_SRC/buildtools/linux64/gn" gen "$OUT_DIR"

          echo '=== Cronet targets ==='
          "$CHROMIUM_SRC/buildtools/linux64/gn" ls "$OUT_DIR" | grep -E '(^|/)cronet(:cronet)?$|components/cronet' | head -100 || true

      - name: Verify Cronet target and build shared library
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          cd "$CHROMIUM_SRC"

          # GN/Ninja target syntax is relative to the output directory.
          # Do NOT pass a leading // to autoninja; that becomes /components/cronet:cronet.
          TARGET='components/cronet:cronet'

          if ! "$CHROMIUM_SRC/buildtools/linux64/gn" ls "$OUT_DIR" | grep -Fxq 'components/cronet:cronet'; then
            echo 'ERROR: components/cronet:cronet is not present in the generated target graph.'
            echo 'Available Cronet targets:'
            "$CHROMIUM_SRC/buildtools/linux64/gn" ls "$OUT_DIR" | grep -i cronet | head -200 || true
            exit 1
          fi

          autoninja -C "$OUT_DIR" "$TARGET"

      - name: Collect and verify Cronet shared library
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

          rm -rf /home/runner/cronet-artifact
          mkdir -p /home/runner/cronet-artifact

          found=''
          while IFS= read -r candidate; do
            if [[ -n "$candidate" ]]; then
              found="$candidate"
              break
            fi
          done < <(find "$OUT_DIR" -type f \( -name 'libcronet*.so' -o -name 'cronet*.so' \) -print | sort)

          if [[ -z "$found" ]]; then
            echo 'ERROR: no Cronet shared library was produced.'
            echo 'Shared libraries found under output directory:'
            find "$OUT_DIR" -type f -name '*.so*' -print | sort | head -300 || true
            exit 1
          fi

          echo "Found: $found"
          cp -L "$found" /home/runner/cronet-artifact/libcronet.so

          file /home/runner/cronet-artifact/libcronet.so
          readelf -h /home/runner/cronet-artifact/libcronet.so

          if ! file /home/runner/cronet-artifact/libcronet.so | grep -Eq 'ELF 64-bit.*x86-64'; then
            echo 'ERROR: the produced library is not a Linux x86-64 ELF shared object.'
            exit 1
          fi

          sha256sum /home/runner/cronet-artifact/libcronet.so | tee /home/runner/cronet-artifact/SHA256SUMS.txt

          {
            printf 'Chromium revision: '
            git -C "$CHROMIUM_SRC" rev-parse HEAD
            printf 'Chromium version: '
            tr '\n' ' ' < "$CHROMIUM_SRC/chrome/VERSION"
            printf '\n'
            printf 'Runner: ubuntu-latest\n'
            printf 'Architecture: x86_64\n'
            printf 'GN target: components/cronet:cronet\n'
            printf 'Original library: %s\n' "$found"
            printf 'Output library: libcronet.so\n'
          } > /home/runner/cronet-artifact/build-info.txt

      - name: Upload Cronet library
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-latest
          path: /home/runner/cronet-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
