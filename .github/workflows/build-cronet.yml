name: Build Latest Chromium Cronet Linux x64

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  linux-x64:
    name: Linux x64 Cronet
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEPOT_TOOLS: /home/runner/depot_tools
      CHROMIUM_ROOT: /home/runner/chromium
      CHROMIUM_SRC: /home/runner/chromium/src
      OUT_DIR: /home/runner/chromium/src/out/Cronet
      GIT_TERMINAL_PROMPT: '0'
      DEPOT_TOOLS_UPDATE: '1'

    steps:
      - name: Show runner information
        shell: bash
        run: |
          set -euxo pipefail
          echo '=== OS ==='
          uname -a
          echo '=== Architecture ==='
          arch
          echo '=== CPU ==='
          nproc
          echo '=== Memory ==='
          free -h
          echo '=== Disk ==='
          df -h /

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/share/dotnet \
            /usr/lib/jvm \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk \
            /opt/hostedtoolcache/node \
            /opt/hostedtoolcache/Ruby \
            /opt/az \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/aws-sam-cli \
            /usr/local/share/chromium \
            /usr/local/lib/heroku \
            /usr/local/share/vcpkg \
            2>/dev/null || true

          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/* /tmp/* || true
          docker system prune -af --volumes 2>/dev/null || true

          echo '=== Disk after cleanup ==='
          df -h /

      - name: Install host packages
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            git-lfs \
            lsb-release \
            ninja-build \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip

      - name: Install Chromium build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/chromium-deps
          git clone --depth=1 https://chromium.googlesource.com/chromium/src.git /tmp/chromium-deps
          cd /tmp/chromium-deps

          # Chromium's own dependency installer is the source of truth for build packages.
          sudo ./build/install-build-deps.sh --no-prompt --no-chromeos-fonts --no-nacl

          cd /
          rm -rf /tmp/chromium-deps

      - name: Install latest depot_tools
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$DEPOT_TOOLS"
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS"
          export PATH="$DEPOT_TOOLS:$PATH"

          echo "depot_tools=$DEPOT_TOOLS" >> "$GITHUB_ENV"
          echo "$DEPOT_TOOLS" >> "$GITHUB_PATH"

          # First invocation bootstraps depot_tools' bundled Python/runtime.
          gclient metrics --enable || true
          gclient help >/dev/null

          echo '=== depot_tools tools ==='
          command -v gclient
          command -v fetch
          command -v autoninja
          command -v gn || true
          ls -la "$DEPOT_TOOLS/python-bin" || true

      - name: Checkout latest Chromium main without history
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"

          rm -rf "$CHROMIUM_ROOT"
          mkdir -p "$CHROMIUM_ROOT"
          cd "$CHROMIUM_ROOT"

          # No branch/tag is specified: fetch gets the current Chromium main checkout.
          fetch --nohooks --no-history chromium

          cd "$CHROMIUM_SRC"

          echo '=== Chromium revision ==='
          git rev-parse HEAD | tee /home/runner/chromium_revision.txt

          echo '=== Chromium version ==='
          cat chrome/VERSION | tee /home/runner/chromium_version.txt

          echo '=== Disk ==='
          df -h /

      - name: Run Chromium hooks
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"

          gclient runhooks

          echo '=== Verify generated build tools ==='
          test -x "$CHROMIUM_SRC/buildtools/linux64/gn"
          test -x "$CHROMIUM_SRC/buildtools/linux64/gn"
          command -v gn || true
          command -v autoninja

          "$CHROMIUM_SRC/buildtools/linux64/gn" --version

          echo '=== Disk after hooks ==='
          df -h /

      - name: Generate GN args
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          cat > "$OUT_DIR/args.gn" <<'GNARGS'
          target_cpu = "x64"
          is_debug = false
          is_component_build = false
          is_official_build = true
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          dcheck_always_on = false
          enable_nacl = false
          use_goma = false
          use_remoteexec = false
          GNARGS

          echo '=== args.gn ==='
          cat "$OUT_DIR/args.gn"

      - name: GN generate
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"

          GN="$CHROMIUM_SRC/buildtools/linux64/gn"
          test -x "$GN"

          "$GN" gen "$OUT_DIR"
          "$GN" args "$OUT_DIR" --list > /home/runner/gn_args.txt
          "$GN" desc "$OUT_DIR" //components/cronet:cronet > /home/runner/gn_cronet_desc.txt

      - name: Build Cronet shared library
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"

          # Build only the native desktop Cronet target.
          autoninja -C "$OUT_DIR" //components/cronet:cronet

      - name: Locate and verify Cronet shared library
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CHROMIUM_SRC"

          found=''
          while IFS= read -r candidate; do
            found="$candidate"
            break
          done < <(find "$OUT_DIR" -type f \( -name 'libcronet*.so' -o -name 'cronet*.so' \) -print)

          if [[ -z "$found" ]]; then
            echo 'ERROR: no Cronet shared library was produced.'
            echo 'Existing shared libraries:'
            find "$OUT_DIR" -type f -name '*.so' -print | head -200 || true
            exit 1
          fi

          mkdir -p /home/runner/cronet-artifact
          cp -L "$found" /home/runner/cronet-artifact/libcronet.so

          echo "Original output: $found" | tee /home/runner/cronet-artifact/build-info.txt
          echo "Chromium revision: $(git rev-parse HEAD)" >> /home/runner/cronet-artifact/build-info.txt
          echo "Chromium version: $(tr '\n' ' ' < chrome/VERSION)" >> /home/runner/cronet-artifact/build-info.txt
          echo 'Runner: ubuntu-latest' >> /home/runner/cronet-artifact/build-info.txt
          echo 'Architecture: x86_64' >> /home/runner/cronet-artifact/build-info.txt
          echo 'GN target: //components/cronet:cronet' >> /home/runner/cronet-artifact/build-info.txt

          echo '=== file ==='
          file /home/runner/cronet-artifact/libcronet.so

          echo '=== ELF header ==='
          readelf -h /home/runner/cronet-artifact/libcronet.so

          echo '=== Needed libraries ==='
          readelf -d /home/runner/cronet-artifact/libcronet.so | grep NEEDED || true

          echo '=== SHA256 ==='
          sha256sum /home/runner/cronet-artifact/libcronet.so | tee /home/runner/cronet-artifact/SHA256SUMS.txt

      - name: Upload Cronet artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-latest
          path: /home/runner/cronet-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-build-metadata
          path: |
            /home/runner/chromium_revision.txt
            /home/runner/chromium_version.txt
            /home/runner/gn_args.txt
            /home/runner/gn_cronet_desc.txt
          if-no-files-found: warn
          retention-days: 7
