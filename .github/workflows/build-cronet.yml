name: Build cronet-go Chromium Fork Linux x64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-latest-cronet-linux-x64
  cancel-in-progress: true

env:
  CRONET_GO_ROOT: /home/runner/cronet-go
  NAIVE_ROOT: /home/runner/cronet-go/naiveproxy
  CHROMIUM_SRC: /home/runner/cronet-go/naiveproxy/src
  OUT_DIR: /home/runner/cronet-go/naiveproxy/src/out/cronet-linux-x64

jobs:
  linux-x64:
    name: Build cronet-go Chromium Fork Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Show runner information
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          arch
          nproc
          free -h
          df -h /
          python3 --version
          git --version

      - name: Install basic host packages
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            git-lfs \
            lsb-release \
            ccache \
            ninja-build \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Checkout cronet-go and its Chromium fork
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$CRONET_GO_ROOT"
          git clone --recursive --depth=1 \
            https://github.com/SagerNet/cronet-go.git \
            "$CRONET_GO_ROOT"

          test -f "$CRONET_GO_ROOT/go.mod"
          test -f "$NAIVE_ROOT/CHROMIUM_VERSION"
          test -f "$CHROMIUM_SRC/components/cronet/BUILD.gn"
          grep -Fq 'static_library("cronet_static")' \
            "$CHROMIUM_SRC/components/cronet/BUILD.gn"
          grep -Fq 'shared_library("cronet")' \
            "$CHROMIUM_SRC/components/cronet/BUILD.gn"

          git -C "$CRONET_GO_ROOT" rev-parse HEAD \
            | tee /home/runner/cronet_go_revision.txt
          git -C "$NAIVE_ROOT" rev-parse HEAD \
            | tee /home/runner/naiveproxy_revision.txt

          echo "Chromium version:"
          cat "$NAIVE_ROOT/CHROMIUM_VERSION" \
            | tee /home/runner/chromium_version.txt

      - name: Prepare Chromium fork toolchain
        shell: bash
        run: |
          set -euxo pipefail
          rm -f "$CHROMIUM_SRC/build/linux/sysroot_scripts/keyring.gpg"
          GPG_TTY=/dev/null \
            "$CHROMIUM_SRC/build/linux/sysroot_scripts/generate_keyring.sh"

      - name: Build Linux x64 Cronet static and shared libraries
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CRONET_GO_ROOT"
          go run ./cmd/build-naive --target=linux/amd64 build

      - name: Locate and validate Cronet Linux x64 library
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CHROMIUM_SRC"

          mkdir -p /home/runner/cronet-artifact

          found="$(find "$OUT_DIR" -type f \( -name 'libcronet.so' -o -name 'libcronet.*.so' -o -name 'cronet.*.so' \) -print | head -n 1 || true)"

          if [[ -z "$found" ]]; then
            echo 'ERROR: No Cronet shared library was produced.'
            echo 'All shared libraries under the output directory:'
            find "$OUT_DIR" -type f -name '*.so' -print | head -200 || true
            exit 1
          fi

          echo "Found: $found"
          cp -L "$found" /home/runner/cronet-artifact/libcronet.so

          file /home/runner/cronet-artifact/libcronet.so
          readelf -h /home/runner/cronet-artifact/libcronet.so

          file /home/runner/cronet-artifact/libcronet.so | grep -Eq 'ELF 64-bit.*x86-64'

          sha256sum /home/runner/cronet-artifact/libcronet.so \
            | tee /home/runner/cronet-artifact/SHA256SUMS.txt

          {
            echo "cronet-go revision: $(git -C "$CRONET_GO_ROOT" rev-parse HEAD)"
            echo "naiveproxy revision: $(git -C "$NAIVE_ROOT" rev-parse HEAD)"
            echo "Chromium version: $(tr '\n' ' ' < "$NAIVE_ROOT/CHROMIUM_VERSION")"
            echo "Runner: ubuntu-22.04"
            echo "Architecture: x86_64"
            echo "GN target: //components/cronet:cronet"
            echo "Source library: $found"
          } > /home/runner/cronet-artifact/build-info.txt

      - name: Upload Cronet artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-latest
          path: /home/runner/cronet-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-build-metadata
          path: |
            /home/runner/cronet_go_revision.txt
            /home/runner/naiveproxy_revision.txt
            /home/runner/chromium_version.txt
          if-no-files-found: warn
          retention-days: 7
