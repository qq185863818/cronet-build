name: Build Chromium Cronet Linux x64 150.0.7871.63

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cronet-linux-x64-150
  cancel-in-progress: true

env:
  CHROMIUM_VERSION: "150.0.7871.63"
  NAIVEPROXY_REF: 72a06c9fca0e2d228588c7f3074bf7efff3ff686
  DEPOT_TOOLS: /home/runner/depot_tools
  CHROMIUM_ROOT: /home/runner/chromium
  CHROMIUM_SRC: /home/runner/chromium/src
  OUT_DIR: /home/runner/chromium/src/out/Cronet

jobs:
  linux-x64:
    name: Build Cronet shared library
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out the matching native API bridge
        uses: actions/checkout@v4
        with:
          repository: SagerNet/naiveproxy
          ref: 72a06c9fca0e2d228588c7f3074bf7efff3ff686
          path: naiveproxy-ref
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CHROMIUM_VERSION
            /src/components/cronet/BUILD.gn
            /src/components/cronet/cronet_exports.lst
            /src/components/cronet/native/**

      - name: Verify the pinned bridge source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C naiveproxy-ref rev-parse HEAD)" = "$NAIVEPROXY_REF"
          test "$(tr -d '\r\n' < naiveproxy-ref/CHROMIUM_VERSION)" = "$CHROMIUM_VERSION"
          grep -Fq 'shared_library("cronet")' naiveproxy-ref/src/components/cronet/BUILD.gn
          grep -Fq '"//components/cronet/native:cronet_native_impl"' naiveproxy-ref/src/components/cronet/BUILD.gn
          test -f naiveproxy-ref/src/components/cronet/native/BUILD.gn
          test -f naiveproxy-ref/src/components/cronet/cronet_exports.lst

      - name: Install host build packages
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            file \
            git \
            git-lfs \
            gnupg \
            lsb-release \
            ninja-build \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip

      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: cronet-ccache-linux-x64-${{ env.CHROMIUM_VERSION }}-${{ env.NAIVEPROXY_REF }}
          restore-keys: |
            cronet-ccache-linux-x64-${{ env.CHROMIUM_VERSION }}-

      - name: Install depot_tools
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$DEPOT_TOOLS"
          cd "$DEPOT_TOOLS"
          ./ensure_bootstrap
          test -f "$DEPOT_TOOLS/python3_bin_reldir.txt"
          echo "$DEPOT_TOOLS" >> "$GITHUB_PATH"
          export PATH="$DEPOT_TOOLS:$PATH"
          command -v gclient
          command -v autoninja

      - name: Sync the exact official Chromium version
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$CHROMIUM_ROOT"
          cd "$CHROMIUM_ROOT"
          gclient config https://chromium.googlesource.com/chromium/src.git
          gclient sync \
            --nohooks \
            --no-history \
            --revision="src@refs/tags/$CHROMIUM_VERSION"

          actual_version="$(awk -F= '
            $1 == "MAJOR" { major = $2 }
            $1 == "MINOR" { minor = $2 }
            $1 == "BUILD" { build = $2 }
            $1 == "PATCH" { patch = $2 }
            END { printf "%s.%s.%s.%s", major, minor, build, patch }
          ' "$CHROMIUM_SRC/chrome/VERSION")"
          test "$actual_version" = "$CHROMIUM_VERSION"
          CHROMIUM_REVISION="$(git -C "$CHROMIUM_SRC" rev-parse HEAD)"
          printf '%s\n' "$CHROMIUM_REVISION" | tee "$GITHUB_WORKSPACE/chromium_revision.txt"
          echo "CHROMIUM_REVISION=$CHROMIUM_REVISION" >> "$GITHUB_ENV"

      - name: Install Chromium build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CHROMIUM_SRC"
          rm -f build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null build/linux/sysroot_scripts/generate_keyring.sh
          sudo ./build/install-build-deps.sh \
            --no-prompt \
            --no-chromeos-fonts \
            --no-nacl

      - name: Sync toolchains and run Chromium hooks
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"
          gclient runhooks
          test -x buildtools/linux64/gn
          test -x "$DEPOT_TOOLS/autoninja"

      - name: Add the Linux native bridge target
        shell: bash
        run: |
          set -euxo pipefail
          reference="$GITHUB_WORKSPACE/naiveproxy-ref/src/components/cronet"
          destination="$CHROMIUM_SRC/components/cronet"

          test ! -e "$destination/native"
          cp -a "$reference/native" "$destination/native"
          test ! -e "$destination/cronet_exports.lst"
          cp "$reference/cronet_exports.lst" "$destination/cronet_exports.lst"
          test -f "$destination/cronet_global_state_stubs.cc"

          python3 - "$destination/BUILD.gn" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          marker = 'import("//build/buildflag_header.gni")\n'

          if text.count(marker) != 1:
              raise SystemExit("Unexpected upstream Cronet BUILD.gn layout")
          if 'shared_library("cronet")' in text:
              raise SystemExit("Cronet shared-library target already exists")

          text = text.replace(
              marker,
              marker + 'import("//build/config/c++/c++.gni")\n',
              1,
          )
          text += '''

          # Linux C API bridge from the pinned native source; Cronet core stays upstream.
          if (is_linux) {
            shared_library("cronet") {
              deps = [
                "//base",
                "//components/cronet:cronet_common",
                "//components/cronet/native:cronet_native_impl",
                "//components/grpc_support",
                "//net",
              ]

              if (use_custom_libcxx) {
                deps += [ "//build/config:shared_library_deps" ]
              }

              sources = [ "cronet_global_state_stubs.cc" ]
              inputs = [ "cronet_exports.lst" ]
              ldflags = [
                "-Wl,--version-script=" + rebase_path("cronet_exports.lst"),
              ]
            }
          }
          '''
          path.write_text(text, encoding="utf-8")
          PY

      - name: Generate the Linux x64 Cronet build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$OUT_DIR"
          cat > "$OUT_DIR/args.gn" <<'EOF'
          target_os = "linux"
          target_cpu = "x64"
          is_debug = false
          is_component_build = false
          is_official_build = true
          is_clang = true
          is_cronet_build = true
          use_clang_modules = false
          cc_wrapper = "ccache"
          use_thin_lto = false
          use_sysroot = true
          chrome_pgo_phase = 0
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          dcheck_always_on = false
          fatal_linker_warnings = false
          treat_warnings_as_errors = false
          is_cfi = false
          use_cfi_icall = false
          optimize_for_size = true
          EOF

          GN="$CHROMIUM_SRC/buildtools/linux64/gn"
          "$GN" gen "$OUT_DIR"
          test "$("$GN" desc "$OUT_DIR" //components/cronet:cronet type)" = "shared_library"

      - name: Build Cronet shared library
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          ccache -M 5G
          ccache -z
          autoninja -C "$OUT_DIR" //components/cronet:cronet
          ccache -s

      - name: Validate and stage libcronet.so
        shell: bash
        run: |
          set -euxo pipefail
          source_library="$OUT_DIR/libcronet.so"
          output_library="$GITHUB_WORKSPACE/libcronet.so"
          test -s "$source_library"
          cp -L "$source_library" "$output_library"

          file "$output_library" | tee "$GITHUB_WORKSPACE/library-file.txt"
          file "$output_library" | grep -Eq 'ELF 64-bit.*x86-64'
          readelf -h "$output_library"
          nm -D --defined-only "$output_library" \
            | awk '{ print $NF }' \
            | grep -Fxq Cronet_Engine_Create

          python3 - "$output_library" <<'PY'
          import ctypes
          import sys

          library = ctypes.CDLL(sys.argv[1])
          library.Cronet_Engine_Create.restype = ctypes.c_void_p
          library.Cronet_Engine_Destroy.argtypes = [ctypes.c_void_p]
          engine = library.Cronet_Engine_Create()
          if not engine:
              raise SystemExit("Cronet_Engine_Create returned null")
          library.Cronet_Engine_Destroy(engine)
          print("Cronet C API load/create/destroy smoke test passed")
          PY

          (cd "$GITHUB_WORKSPACE" && sha256sum libcronet.so > SHA256SUMS.txt)
          {
            printf 'Chromium version: %s\n' "$CHROMIUM_VERSION"
            printf 'Chromium revision: %s\n' "$CHROMIUM_REVISION"
            printf 'Native bridge revision: %s\n' "$NAIVEPROXY_REF"
            printf 'GN target: //components/cronet:cronet\n'
            printf 'Architecture: x86_64\n'
            printf 'Runner: ubuntu-24.04\n'
          } > "$GITHUB_WORKSPACE/build-info.txt"

      - name: Upload libcronet.so and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-${{ env.CHROMIUM_VERSION }}
          path: |
            libcronet.so
            SHA256SUMS.txt
            build-info.txt
            chromium_revision.txt
            library-file.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
